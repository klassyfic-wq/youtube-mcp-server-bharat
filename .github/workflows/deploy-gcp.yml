name: Deploy GCP media pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Create/update GCP media pipeline resources (metered services)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-media-pipeline-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-south1
      TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      MEDIA_BUCKET: ${{ vars.GCP_MEDIA_BUCKET }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PROJECT_ID TF_STATE_BUCKET MEDIA_BUCKET WIF_PROVIDER DEPLOYER_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions repository variable: ${name}"
              exit 1
            fi
          done
          if [[ "$TF_STATE_BUCKET" == "$MEDIA_BUCKET" ]]; then
            echo "::error::Terraform state bucket and media bucket must be different."
            exit 1
          fi

      - name: Authenticate to Google Cloud using GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Bootstrap Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable storage.googleapis.com serviceusage.googleapis.com iam.googleapis.com cloudresourcemanager.googleapis.com --project="$PROJECT_ID"
          if ! gcloud storage buckets describe "gs://$TF_STATE_BUCKET" --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://$TF_STATE_BUCKET" \
              --project="$PROJECT_ID" \
              --location="$REGION" \
              --uniform-bucket-level-access
          fi
          gcloud storage buckets update "gs://$TF_STATE_BUCKET" --versioning

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize remote Terraform state
        working-directory: infra/gcp
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=klassyfic/media-pipeline"

      - name: Bootstrap GCP resources
        working-directory: infra/gcp
        run: |
          terraform apply -input=false -auto-approve \
            -target=google_project_service.apis \
            -target=google_artifact_registry_repository.renderer \
            -target=google_artifact_registry_repository_iam_member.cloud_build_writer \
            -target=google_storage_bucket.media \
            -target=google_service_account.renderer \
            -target=google_secret_manager_secret.renderer_shared_secret \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="bucket_name=${{ env.MEDIA_BUCKET }}" \
            -var="worker_host=youtube-mcp-server-bharat.klassyfic.workers.dev" \
            -var="deployer_service_account=$DEPLOYER_SERVICE_ACCOUNT" \
            -var="renderer_image=placeholder"

      - name: Create renderer shared secret version if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud secrets versions list klassyfic-renderer-shared-secret \
              --project="$PROJECT_ID" \
              --filter="state=ENABLED" \
              --format="value(name)" | grep -q .; then
            secret_file="$(mktemp)"
            trap 'rm -f "$secret_file"' EXIT
            umask 077
            openssl rand -hex 32 > "$secret_file"
            gcloud secrets versions add klassyfic-renderer-shared-secret \
              --project="$PROJECT_ID" \
              --data-file="$secret_file"
          fi

      - name: Build and push renderer image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/klassyfic-media/renderer:latest"

          # Submit asynchronously; poll build metadata instead of streaming logs.
          BUILD_ID="$(gcloud builds submit --async --quiet --format='value(id)' --project="$PROJECT_ID" --tag="$IMAGE" renderer/)"
          if [[ -z "$BUILD_ID" ]]; then
            echo "::error::Cloud Build submission returned no build ID."
            exit 1
          fi
          echo "Cloud Build submitted: $BUILD_ID"
          echo "Build details: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"

          for attempt in $(seq 1 240); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project="$PROJECT_ID" --format='value(status)')"
            echo "Cloud Build status: $STATUS (poll $attempt/240)"
            case "$STATUS" in
              SUCCESS)
                echo "Renderer image built and pushed successfully."
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build $BUILD_ID finished with status $STATUS."
                exit 1
                ;;
              QUEUED|WORKING|"")
                sleep 10
                ;;
              *)
                echo "::error::Unexpected Cloud Build status: $STATUS"
                exit 1
                ;;
            esac
          done

          if [[ "$STATUS" != "SUCCESS" ]]; then
            echo "::error::Timed out waiting for Cloud Build $BUILD_ID after 40 minutes (last status: $STATUS)."
            exit 1
          fi

      - name: Apply complete GCP infrastructure
        working-directory: infra/gcp
        run: |
          set -euo pipefail
          TAGGED_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/klassyfic-media/renderer:latest"
          DIGEST="$(gcloud artifacts docker images describe "$TAGGED_IMAGE" --project="$PROJECT_ID" --format='value(image_summary.digest)')"
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a valid renderer image digest: $DIGEST"
            exit 1
          fi
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/klassyfic-media/renderer@$DIGEST"
          echo "Deploying immutable renderer image: $IMAGE"
          terraform apply -input=false -auto-approve \
            -var="project_id=$PROJECT_ID" \
            -var="region=$REGION" \
            -var="bucket_name=$MEDIA_BUCKET" \
            -var="worker_host=youtube-mcp-server-bharat.klassyfic.workers.dev" \
            -var="deployer_service_account=$DEPLOYER_SERVICE_ACCOUNT" \
            -var="renderer_image=$IMAGE"

      - name: Set up Node.js for Worker secret sync
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync renderer shared secret to Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Cloudflare API token/account ID secrets are required to sync the renderer credential."
            exit 1
          fi
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          gcloud secrets versions access latest \
            --secret=klassyfic-renderer-shared-secret \
            --project="$PROJECT_ID" > "$secret_file"
          test -s "$secret_file"
          npm install --no-package-lock --no-audit --no-fund
          npx wrangler secret put TTS_API_KEY --name youtube-mcp-server-bharat < "$secret_file"

      - name: Smoke test renderer health, Marathi TTS, and Vertex image generation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          umask 077
          gcloud secrets versions access latest \
            --secret=klassyfic-renderer-shared-secret \
            --project="$PROJECT_ID" > "$tmp/renderer-secret"
          RENDERER_URL="$(gcloud run services describe klassyfic-video-renderer --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          if [[ -z "$RENDERER_URL" ]]; then
            echo "::error::Cloud Run renderer URL was not returned."
            exit 1
          fi
          printf 'header = "Authorization: Bearer %s"\n' "$(cat "$tmp/renderer-secret")" > "$tmp/curl.conf"
          chmod 600 "$tmp/curl.conf"

          curl --config "$tmp/curl.conf" --fail-with-body --silent --show-error \
            "$RENDERER_URL/health" -o "$tmp/health.json"
          python - "$tmp/health.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("executionMode") == "cloud-run-jobs", data
          print("Renderer authenticated health: PASS")
          PY

          curl --config "$tmp/curl.conf" --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"input":"नमस्कार! ही मराठी आवाज चाचणी आहे.","voice":"mr-IN-Chirp3-HD-Achird","response_format":"mp3"}' \
            "$RENDERER_URL/v1/audio/speech" -o "$tmp/marathi.mp3"
          python - "$tmp/marathi.mp3" <<'PY'
          import os, sys
          data = open(sys.argv[1], "rb").read()
          assert len(data) > 1000, f"Unexpectedly small TTS output: {len(data)} bytes"
          assert data[:3] == b"ID3" or (len(data) > 2 and data[0] == 0xff and data[1] & 0xe0 == 0xe0), "Not a valid MP3 stream"
          print(f"Marathi Chirp 3 HD TTS: PASS ({len(data)} bytes)")
          PY

          image_status="$(curl --config "$tmp/curl.conf" --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"model":"gemini-2.5-flash-image","prompt":"A clean cinematic illustration of a colorful paper kite flying over a green field at sunrise, no text or lettering","n":1,"size":"1024x1024","response_format":"b64_json"}' \
            "$RENDERER_URL/v1/images/generations" -o "$tmp/image.json" -w '%{http_code}')"
          if [[ "$image_status" != "200" ]]; then
            python - "$tmp/image.json" "$image_status" <<'PY'
          import json, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          try:
              payload = json.loads(raw)
          except Exception:
              payload = {"response": raw[:2000]}
          message = payload.get("error", payload)
          if isinstance(message, dict):
              message = {k: v for k, v in message.items() if k.lower() not in {"authorization", "token", "access_token"}}
          print(f"Vertex image smoke test HTTP {sys.argv[2]}: {json.dumps(message, ensure_ascii=False)[:3000]}")
          PY
            echo "::error::Vertex image generation smoke test failed with HTTP $image_status."
            exit 1
          fi
          python - "$tmp/image.json" <<'PY'
          import base64, json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          encoded = payload.get("data", [{}])[0].get("b64_json")
          assert isinstance(encoded, str) and encoded, "No base64 image returned"
          image = base64.b64decode(encoded, validate=True)
          assert 8 < len(image) <= 6 * 1024 * 1024, f"Image size outside limit: {len(image)}"
          assert image.startswith(b"\x89PNG\r\n\x1a\n") or image.startswith(b"\xff\xd8\xff"), "Invalid PNG/JPEG signature"
          print(f"Vertex AI scene image generation: PASS ({len(image)} bytes)")
          PY


      - name: Install FFmpeg for production E2E playback validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run production synthetic video render and Shorts E2E
        shell: bash
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          MEDIA_BUCKET: ${{ env.MEDIA_BUCKET }}
          SIGNER_SERVICE_ACCOUNT: klassyfic-e2e-signer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          RENDERER_URL="$(gcloud run services describe klassyfic-video-renderer --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          test -n "$RENDERER_URL"
          export RENDERER_URL
          .github/scripts/production-e2e-render-shorts.sh

      - name: Upload production E2E preview videos and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-previews-${{ github.run_id }}
          path: ${{ runner.temp }}/production-e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean production E2E source assets and temporary preview records
        if: always() && steps.auth.outcome == 'success'
        shell: bash
        env:
          E2E_PREFIX: ${{ env.E2E_PREFIX }}
          E2E_JOB_ID: ${{ env.E2E_JOB_ID }}
          E2E_SHORTS_ID: ${{ env.E2E_SHORTS_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${E2E_PREFIX:-}" ]]; then
            gcloud storage rm --recursive "gs://$MEDIA_BUCKET/$E2E_PREFIX/**" --quiet || echo "::warning::Could not remove synthetic E2E source assets."
          fi
          if [[ -n "${E2E_JOB_ID:-}" ]]; then
            gcloud storage rm "gs://$MEDIA_BUCKET/jobs/$E2E_JOB_ID.json" "gs://$MEDIA_BUCKET/$E2E_JOB_ID/preview.mp4" --quiet || echo "::warning::Could not remove synthetic E2E render records."
          fi
          if [[ -n "${E2E_SHORTS_ID:-}" ]]; then
            gcloud storage rm "gs://$MEDIA_BUCKET/shorts/$E2E_SHORTS_ID/preview.mp4" --quiet || echo "::warning::Could not remove synthetic E2E Shorts preview."
          fi

      - name: Report deployment outputs
        working-directory: infra/gcp
        run: |
          echo "Renderer URL:"
          terraform output -raw renderer_url
          echo
          echo "Renderer Job:"
          terraform output -raw renderer_job_name
          echo
          echo "Media bucket:"
          terraform output -raw bucket_name
