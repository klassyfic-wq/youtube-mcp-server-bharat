name: TypeScript validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "fix/**", "test/**"]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure FFmpeg and Marathi subtitle font for renderer integration test
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v openssl >/dev/null || [ ! -f /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core openssl
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          test -f /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf
      - run: npm install --no-audit --no-fund
      - run: npx wrangler types
      - run: npm run type-check
      - run: npm test
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/gcp init -backend=false -input=false
      - run: terraform -chdir=infra/gcp validate
